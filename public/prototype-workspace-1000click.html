<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Workspace 1000Click — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>:root{
  --navy:#1A1F36; --navy2:#262c4a; --orange:#E8571A; --orange-d:#C4471A; --orange-s:#FFF3EE;
  --indigo:#4F46E5; --indigo-s:#EEF2FF; --blue:#1A5FA0; --blue-s:#EBF4FF;
  --bg:#F5F5F5; --card:#fff; --line:#ECEDF1; --mut:#6B7280; --mut2:#9CA3AF;
  --ok:#16A34A; --ok-s:#E8F7EE; --warn:#D97706; --warn-s:#FEF3C7; --bad:#DC2626; --bad-s:#FEE9E9;
  --be-y:#FFC400; --be-r:#EF0016; --ig:#C13584; --fb:#1877F2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;color:var(--navy);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
.display{font-family:'Nunito',sans-serif;font-weight:900;letter-spacing:-.01em}
svg{display:block}

/* shell */
.proto-bar{background:var(--navy);color:#fff;font-size:12px;padding:6px 16px;display:flex;gap:10px;align-items:center;justify-content:center}
.proto-bar b{background:var(--orange);padding:2px 8px;border-radius:99px;font-weight:700}
.app{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 30px)}
.side{background:var(--navy);color:#C9CDE0;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:calc(100vh - 30px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;position:relative;overflow:hidden}
.brand .mark span{font-family:'Nunito';font-weight:900;font-size:15px;color:var(--navy)}
.brand .mark i{position:absolute;left:0;right:0;bottom:0;height:5px;display:flex}
.brand .mark i:before,.brand .mark i:after{content:"";flex:1;background:#111}
.brand .mark i:after{background:var(--be-r)}
.brand .mark i b{flex:1;background:var(--be-y)}
.brand .t{color:#fff;font-family:'Nunito';font-weight:900;font-size:17px;line-height:1}
.brand .t small{display:block;font-family:'Inter';font-weight:500;font-size:11px;color:#9AA0BD;margin-top:3px}
.navgrp{font-size:11px;font-weight:600;color:#7C83A6;padding:10px 12px 4px;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:11px;padding:7px 12px;border-radius:10px;color:#C9CDE0;font-weight:500;width:100%;text-align:left;transition:background .15s}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:var(--orange);color:#fff;font-weight:600}
.nav .cnt{margin-left:auto;background:rgba(255,255,255,.14);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.nav.on .cnt{background:rgba(255,255,255,.25)}
.nav .cnt.hot{background:var(--orange);color:#fff}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid rgba(255,255,255,.1)}
.av{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.main{min-width:0}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.top h1{font-family:'Nunito';font-weight:900;font-size:22px;letter-spacing:-.01em}
.top .sub{color:var(--mut);font-size:13px}
.top .sp{flex:1}
.page{padding:24px 28px 48px;max-width:1500px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:8px 12px;width:260px;color:var(--mut)}
.search input{background:none;border:0;outline:0;width:100%}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bg);position:relative}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:2px solid #fff}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;transition:transform .1s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--orange);color:#fff}.btn.pri:hover{background:var(--orange-d)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.ghost:hover{background:var(--bg)}
.btn.soft{background:var(--orange-s);color:var(--orange-d)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad-s);color:var(--bad)}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}
.tabs a,.tabs button{padding:10px 14px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs .on{color:var(--orange);border-color:var(--orange)}
.sw{width:40px;height:23px;border-radius:99px;background:#D1D5DB;position:relative;flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on:after{left:20px}
.inp{width:100%;padding:10px 12px;border:1px solid #DCDEE6;border-radius:10px;background:#fff;outline:0}
.inp:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,87,26,.15)}
textarea.inp{resize:vertical;line-height:1.55}
label.l{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.hint{font-size:12px;color:var(--mut);margin-top:5px}

/* cards & layout */
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:20px}
.card h3{font-family:'Nunito';font-weight:900;font-size:16px;margin-bottom:4px}
.card .ch{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.card .ch .sp{flex:1}
.card .ch p{color:var(--mut);font-size:12.5px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.wrap{flex-wrap:wrap}
.mt{margin-top:16px}.mt2{margin-top:24px}
.kpi .lab{color:var(--mut);font-size:12.5px;font-weight:500;display:flex;gap:7px;align-items:center}
.kpi .num{font-family:'Nunito';font-weight:900;font-size:30px;line-height:1.1;margin-top:8px;letter-spacing:-.02em}
.kpi .dl{font-size:12px;font-weight:700;display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:99px;white-space:nowrap}
.kpi .vs{font-size:11.5px;color:var(--mut);margin-top:5px}
.dup{background:var(--ok-s);color:var(--ok)}.ddn{background:var(--bad-s);color:var(--bad)}.dflat{background:var(--bg);color:var(--mut)}
.kpi svg.spark{margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-draft{background:#EEF0F4;color:#4B5563}.p-review{background:var(--warn-s);color:var(--warn)}.p-sched{background:var(--indigo-s);color:var(--indigo)}.p-pub{background:var(--ok-s);color:var(--ok)}.p-err{background:var(--bad-s);color:var(--bad)}
.net{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;color:#fff;flex:none}
.net.ig{background:linear-gradient(45deg,#F9A03F,#E1306C 55%,#833AB4)}.net.fb{background:var(--fb)}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:#FAFAFB}
table.t td.r,table.t th.r{text-align:right}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--orange)}
.thumb{width:44px;height:44px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:'Nunito';font-weight:900;font-size:9px;text-align:center;line-height:1.05;overflow:hidden}
.tri{display:flex;height:5px;border-radius:99px;overflow:hidden;width:54px}.tri i{flex:1;background:#111}.tri i:nth-child(2){background:var(--be-y)}.tri i:nth-child(3){background:var(--be-r)}
.empty{text-align:center;padding:36px 20px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--bg);font-size:12.5px;font-weight:600;border:1px solid transparent}
.chip.on{background:var(--orange-s);color:var(--orange-d);border-color:#F9D2C0}
.divider{height:1px;background:var(--line);margin:16px 0}
.tag{display:inline-block;background:var(--indigo-s);color:var(--indigo);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(26,31,54,.55);display:none;place-items:center;z-index:60;padding:20px}
.modal-bg.show{display:grid}
.modal{background:#fff;border-radius:18px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:24px}
.modal h2{font-family:'Nunito';font-weight:900;font-size:20px;margin-bottom:4px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.cal .dh{padding:9px 10px;font-size:12px;font-weight:700;color:var(--mut);background:#FAFAFB;border-bottom:1px solid var(--line)}
.cal .d{min-height:118px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:relative}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:#FAFAFB}.cal .d.out .dn{color:#C1C5D0}
.cal .d .dn{font-size:12px;font-weight:700;color:var(--mut);display:flex;justify-content:space-between}
.cal .d.today .dn span{background:var(--orange);color:#fff;border-radius:99px;padding:0 7px}
.cal .d:hover .plus{opacity:1}
.plus{opacity:0;transition:.15s;width:20px;height:20px;border-radius:6px;background:var(--orange-s);color:var(--orange);display:grid;place-items:center;font-weight:800}
.ev{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:grab;border-left:3px solid;background:#F3F4F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.ig{border-color:var(--ig);background:#FBEFF5}.ev.fb{border-color:var(--fb);background:#EAF2FE}.ev.st{border-color:var(--orange);background:var(--orange-s)}
.ev.both{border-color:var(--navy)}
.ev .tm{opacity:.65;font-weight:500}
.ev.rv{outline:1.5px dashed var(--warn)}
.ev.dr{opacity:.7;border-style:dashed}

/* phone previews */
.phone{width:290px;border-radius:34px;background:#111;padding:9px;margin:0 auto}
.phone .scr{background:#fff;border-radius:26px;overflow:hidden}
.ph-head{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:12.5px}
.ph-head .a{width:28px;height:28px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:10px;font-family:'Nunito';font-weight:900;position:relative}
.ph-img{aspect-ratio:1;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;font-family:'Nunito';font-weight:900;line-height:1.05;position:relative;overflow:hidden}
.ph-act{display:flex;gap:12px;padding:9px 12px 4px}
.ph-cap{padding:2px 12px 14px;font-size:12px;line-height:1.5}
.story{aspect-ratio:9/16;border-radius:22px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;font-family:'Nunito';font-weight:900}
.story .bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:3px}
.story .bars i{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.4)}.story .bars i.f{background:#fff}
.sticker{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;background:#fff;color:var(--navy);border-radius:10px;padding:6px 12px;font-family:'Inter';font-weight:700;font-size:12px}

/* misc blocks */
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.node{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.node .ni{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.node.trig .ni{background:var(--orange-s);color:var(--orange)}.node.cond .ni{background:var(--warn-s);color:var(--warn)}.node.act .ni{background:var(--indigo-s);color:var(--indigo)}
.link{width:2px;height:20px;background:var(--line);margin:0 auto}
.msg{display:flex;gap:10px;margin-bottom:12px}
.msg .b{background:#F3F4F8;padding:9px 13px;border-radius:14px;border-top-left-radius:4px;max-width:78%;line-height:1.5}
.msg.me{flex-direction:row-reverse}.msg.me .b{background:var(--orange);color:#fff;border-radius:14px;border-top-right-radius:4px}
.convo{display:flex;gap:10px;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.convo:hover{background:var(--bg)}.convo.on{background:var(--orange-s);border-color:#F9D2C0}
.convo .nm{font-weight:700}.convo .pv{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.unread{width:9px;height:9px;border-radius:50%;background:var(--orange);flex:none;margin-top:6px}
.mediag{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.mi{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;cursor:pointer}
.mi .im{aspect-ratio:1;display:grid;place-items:center;color:#fff;font-family:'Nunito';font-weight:900;text-align:center;padding:12px;line-height:1.05}
.mi .mt{padding:9px 11px;font-size:12.5px}
.mi .mt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map{background:linear-gradient(#EEF3FA,#E6EDF7);border-radius:12px;position:relative;height:100%;min-height:260px;overflow:hidden}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lg-l{background:var(--navy);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-r{display:grid;place-items:center;padding:40px;background:#fff}
.help{display:flex;gap:10px;background:var(--blue-s);color:var(--blue);padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.5}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g32{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow:auto}.g2,.g3,.g4{grid-template-columns:1fr}.login{grid-template-columns:1fr}.lg-l{display:none}.page{padding:16px}.search{display:none}}
</style></head><body>

const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p * 2) / 2 * p }
function lineChart({ series: S, labels, h = 230, w = 720, fill = true, fmtY = fmt, yTicks = 4, min = 0 }) {
  const padL = 46, padR = 12, padT = 12, padB = 28
  const max = min ? Math.ceil(Math.max(...S.flatMap(s => s.data)) / 100) * 100 : niceMax(Math.max(...S.flatMap(s => s.data))), iw = w - padL - padR, ih = h - padT - padB
  const x = i => padL + i * iw / (S[0].data.length - 1), y = v => padT + ih - (v - min) / (max - min) * ih
  let g = ''
  for (let t = 0; t <= yTicks; t++) { const v = min + (max - min) * t / yTicks, yy = y(v); g += `<line x1="${padL}" x2="${w - padR}" y1="${yy}" y2="${yy}" stroke="#ECEDF1"/><text x="${padL - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#9CA3AF">${fmtY(Math.round(v))}</text>` }
  const step = Math.ceil(labels.length / 8)
  labels.forEach((l, i) => { if (i % step === 0) g += `<text x="${x(i)}" y="${h - 8}" text-anchor="middle" font-size="11" fill="#9CA3AF">${l}</text>` })
  S.forEach((s, k) => {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`)
    const id = 'g' + Math.random().toString(36).slice(2, 7)
    if (fill && k === 0) g += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="M${pts[0]} L${pts.join(' L')} L${x(S[0].data.length - 1)},${y(min)} L${x(0)},${y(min)}Z" fill="url(#${id})"/>`
    g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.dash ? 1.8 : 2.6}" ${s.dash ? 'stroke-dasharray="5 5"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`
  })
  const last = S[0].data.length - 1
  g += `<circle cx="${x(last)}" cy="${y(S[0].data[last])}" r="4.5" fill="#fff" stroke="${S[0].color}" stroke-width="2.5"/>`
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}</svg>`
}
function barChart({ data, h = 220, w = 720, color = '#E8571A', stacked, keys, colors, fmtY = fmt }) {
  const padL = 46, padB = 28, padT = 10, iw = w - padL - 10, ih = h - padT - padB
  const tot = d => stacked ? keys.reduce((a, k) => a + d[k], 0) : d.v
  const max = niceMax(Math.max(...data.map(tot))), bw = iw / data.length
  let g = ''
  for (let t = 0; t <= 4; t++) { const v = max * t / 4, yy = padT + ih - v / max * ih; g += `<line x1="${padL}" x2="${w - 10}" y1="${yy}" y2="${yy}" stroke="#ECEDF1"/><text x="${padL - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#9CA3AF">${fmtY(Math.round(v))}</text>` }
  data.forEach((d, i) => {
    const bx = padL + i * bw + bw * .2, ww = bw * .6
    if (stacked) { let acc = 0; keys.forEach((k, j) => { const hh = d[k] / max * ih; g += `<rect x="${bx}" y="${padT + ih - acc - hh}" width="${ww}" height="${hh}" fill="${colors[j]}" ${j === keys.length - 1 ? 'rx="4"' : ''}/>`; acc += hh }) }
    else { const hh = d.v / max * ih; g += `<rect x="${bx}" y="${padT + ih - hh}" width="${ww}" height="${hh}" rx="5" fill="${d.color || color}"/>` }
    g += `<text x="${bx + ww / 2}" y="${h - 8}" text-anchor="middle" font-size="11" fill="#9CA3AF">${d.l}</text>`
  })
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${g}</svg>`
}
function donut(parts, size = 150, label = '', sub = '') {
  const tot = parts.reduce((a, p) => a + p.v, 0), r = 54, c = 2 * Math.PI * r; let off = 0
  const arcs = parts.map(p => { const len = p.v / tot * c, s = `<circle r="${r}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len - 2} ${c - len + 2}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off += len; return s }).join('')
  return `<svg viewBox="0 0 140 140" width="${size}" height="${size}"><circle r="${r}" cx="70" cy="70" fill="none" stroke="#F3F4F6" stroke-width="18"/>${arcs}<text x="70" y="68" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="20" fill="#1A1F36">${label}</text><text x="70" y="85" text-anchor="middle" font-size="10" fill="#9CA3AF">${sub}</text></svg>`
}
const spark = (data, color = '#E8571A', w = 110, h = 34) => { const mx = Math.max(...data), mn = Math.min(...data); const pts = data.map((v, i) => `${(i * w / (data.length - 1)).toFixed(1)},${(h - 3 - (v - mn) / (mx - mn || 1) * (h - 6)).toFixed(1)}`).join(' '); return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>` }
function heat({ rows, cols, vals, color = '232,87,26' }) {
  const mx = Math.max(...vals.flat())
  return `<div style="display:grid;grid-template-columns:46px repeat(${cols.length},1fr);gap:4px;font-size:11px;color:#9CA3AF"><span></span>${cols.map(c => `<span style="text-align:center">${c}</span>`).join('')}${rows.map((r, i) => `<span style="align-self:center">${r}</span>${vals[i].map(v => `<span title="${v}" style="height:30px;border-radius:7px;background:rgba(${color},${(.06 + v / mx * .94).toFixed(2)})"></span>`).join('')}`).join('')}</div>`
}
const kpi = (label, icon, num, delta, sp, color) => { const d = delta.startsWith('-') ? 'ddn' : delta === '0 %' ? 'dflat' : 'dup'; return `<div class="card kpi"><div class="lab">${ic(icon, 16)}${label}</div><div class="num">${num}</div><div class="row" style="justify-content:space-between;align-items:flex-end;margin-top:6px"><div><span class="dl ${d}">${ic(d === 'ddn' ? 'dn' : 'up', 12, 2.4)}${delta}</span><div class="vs">vs période préc.</div></div>${sp ? spark(sp, color, 90) : ''}</div></div>` }
const hbars = (rows, color = 'var(--orange)') => { const mx = Math.max(...rows.map(r => r.v)); return rows.map(r => `<div style="margin-bottom:12px"><div class="row" style="margin-bottom:5px"><span style="font-weight:600">${r.l}</span><span class="sp"></span><span style="color:var(--mut)">${r.t ?? fmt(r.v)}</span></div><div class="bar"><i style="width:${r.v / mx * 100}%;background:${r.c || color}"></i></div></div>`).join('') }
const leg = items => `<div class="legend">${items.map(i => `<span><i style="background:${i[1]}"></i>${i[0]}</span>`).join('')}</div>`
const days = (n, end = 13, mon = 'nov.') => Array.from({ length: n }, (_, i) => { const d = end - n + 1 + i; return d > 0 ? `${d} ${mon}` : `${30 + d} oct.` })
const seg = (id, opts, on) => `<div class="seg" id="${id}" data-seg>${opts.map(o => `<button data-v="${o[0]}" class="${o[0] === on ? 'on' : ''}">${o[1]}</button>`).join('')}</div>`
const head = (title, sub, actions = '') => `<div class="row wrap" style="margin-bottom:20px"><div><div class="display" style="font-size:20px">${title}</div>${sub ? `<div style="color:var(--mut);margin-top:2px">${sub}</div>` : ''}</div><span class="sp"></span>${actions}</div>`

      const evh = p => `<div class="${cls(p)}" draggable="true" data-id="${p.id}" title="${p.t}"><span class="tm">${p.h}</span>${p.t}</div>`
      let h = ''
      if (calState.view === 'month') {
        h = '<div class="cal">' + ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map(d => `<div class="dh">${d}</div>`).join('')
        const start = new Date(2026, 9, 26)

    }
    $('#cv').addEventListener('change', e => { calState.view = e.detail; draw() })
    $$('[data-f]').forEach(c => { c.classList.toggle('on', calState.filter[c.dataset.f]); c.onclick = () => { calState.filter[c.dataset.f] = !calState.filter[c.dataset.f]; c.classList.toggle('on'); draw() } })
